<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#e6f6ff" />
  <link rel="canonical" href="https://drena.co.kr/game/" />
  <title>🎈 시니어 활쏘기 풍선 터뜨리기</title>
  <meta name="description" content="큰 글씨 · 터치 한 번으로 즐기는 활쏘기 집중력 게임" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192-game.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512-game.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-192-game.png" />
  <link rel="manifest" href="/game/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="풍선 게임" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="🎈 시니어 활쏘기 풍선 터뜨리기" />
  <meta property="og:description" content="큰 글씨 · 터치 한 번으로 즐기는 활쏘기 집중력 게임" />
  <meta property="og:url" content="https://drena.co.kr/game/" />
  <meta property="og:image" content="https://drena.co.kr/og-balloon.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="시니어 활쏘기 풍선 터뜨리기 게임 화면" />
  <meta property="og:site_name" content="김진유 · Dr ENA · 닥터에나" />
  <meta property="og:locale" content="ko_KR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="🎈 시니어 활쏘기 풍선 터뜨리기" />
  <meta name="twitter:description" content="큰 글씨 · 터치 한 번으로 즐기는 활쏘기 집중력 게임" />
  <meta name="twitter:image" content="https://drena.co.kr/og-balloon.jpg" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --ink: #0d3b45;
      --ink-soft: #3d5a63;
      --ink-mute: #5b7681;
      --teal: #0f8a80;
      --teal-dark: #0a6b63;
      --teal-soft: #e6f7f4;
      --line: #cfe7ee;
      --card: #ffffff;
      --coral: #d94f33;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
        'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
      background: linear-gradient(180deg, #ddf2ff 0%, #ecf9ff 42%, #fff8ea 100%);
      color: var(--ink);
      font-size: 17px;
      line-height: 1.6;
      letter-spacing: -0.01em;
      word-break: keep-all;
      overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── 상단 상태 바 ───────────────────────────── */
    header {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 8px;
      align-items: stretch;
      padding: calc(8px + env(safe-area-inset-top)) max(12px, calc((100% - 560px) / 2)) 8px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 2px solid var(--line);
      z-index: 10;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 5px 6px;
      border: 2px solid #bfe3ee;
      border-radius: 14px;
      background: #f4fbff;
    }
    .stat .k {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-mute);
      letter-spacing: 0;
      line-height: 1.2;
    }
    .stat .v {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.15;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .stat .v em {
      font-style: normal;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-mute);
      margin-left: 1px;
    }
    #time-pill.low {
      background: #fff1ee;
      border-color: #f3b8aa;
    }
    #time-pill.low .v { color: var(--coral); }
    .icon-btn {
      width: 48px;
      border: 2px solid #bfe3ee;
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font-size: 21px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .icon-btn:active { transform: translateY(1px); }

    /* ── 목표 진행 바 ───────────────────────────── */
    #goalbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px max(14px, calc((100% - 560px) / 2)) 8px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 2px solid var(--line);
      z-index: 9;
    }
    #goalbar .gl {
      font-size: 14px;
      font-weight: 800;
      color: var(--teal);
      white-space: nowrap;
      letter-spacing: 0;
    }
    #goalbar .track {
      flex: 1;
      min-width: 0;
      height: 12px;
      border-radius: 999px;
      background: #e3f1f5;
      overflow: hidden;
    }
    #goal-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #35c7ad, var(--teal));
      transition: width 0.25s ease;
    }
    #goal-fill.done { background: linear-gradient(90deg, #ffd166, #f0a100); }
    #goal-now {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-soft);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    /* ── 게임 화면 ─────────────────────────────── */
    #game-area {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 20;
    }
    #overlay.hidden { display: none; }
    .card {
      width: 100%;
      max-width: 430px;
      margin: auto;
      padding: 22px 18px calc(20px + env(safe-area-inset-bottom));
      background: var(--card);
      border: 1px solid #d8edf3;
      border-radius: 26px;
      box-shadow: 0 14px 40px rgba(13, 59, 69, 0.16);
      text-align: center;
    }
    .card.hidden { display: none; }
    .title {
      margin: 0 0 8px;
      font-size: clamp(26px, 7vw, 32px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-wrap: balance;
    }
    .lead {
      margin: 0 auto 18px;
      max-width: 330px;
      font-size: 18px;
      line-height: 1.72;
      color: var(--ink-soft);
    }
    .lead b { color: var(--teal); font-weight: 800; }

    .field { text-align: left; margin-bottom: 14px; }
    .field-label {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 800;
      color: var(--teal);
      letter-spacing: 0;
    }
    .opt-list { display: flex; flex-direction: column; gap: 8px; }
    .opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      padding: 10px 14px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: #f9fdff;
      color: var(--ink);
      font-family: inherit;
      cursor: pointer;
      text-align: left;
    }
    .opt-name {
      font-size: 19px;
      font-weight: 800;
      white-space: nowrap;
      letter-spacing: -0.01em;
    }
    .opt-desc {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--ink-mute);
      text-align: right;
    }
    .opt.active {
      border-color: var(--teal);
      background: var(--teal-soft);
    }
    .opt.active .opt-name { color: var(--teal-dark); }
    .opt.active .opt-name::after { content: ' ✓'; color: var(--teal); }
    .opt.active .opt-desc { color: var(--teal-dark); }

    .chip-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .chip {
      min-height: 54px;
      padding: 8px 4px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: #f9fdff;
      color: var(--ink);
      font-family: inherit;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.01em;
      white-space: nowrap;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .chip.active {
      border-color: var(--teal);
      background: var(--teal);
      color: #fff;
    }

    .start-btn {
      width: 100%;
      min-height: 62px;
      margin-top: 6px;
      border: none;
      border-radius: 20px;
      background: var(--teal);
      color: #fff;
      font-family: inherit;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--teal-dark);
      transition: transform 0.06s, box-shadow 0.06s;
    }
    .start-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--teal-dark);
    }
    .ghost-btn {
      width: 100%;
      min-height: 54px;
      margin-top: 10px;
      border: 2px solid var(--line);
      border-radius: 18px;
      background: #fff;
      color: var(--ink-soft);
      font-family: inherit;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }
    .hint {
      margin: 12px 0 0;
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink-mute);
    }

    /* ── 결과 화면 ─────────────────────────────── */
    .res-score {
      margin-top: 4px;
      font-size: clamp(56px, 16vw, 68px);
      font-weight: 800;
      line-height: 1.05;
      color: var(--teal);
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .res-score small {
      font-size: 24px;
      font-weight: 800;
      color: var(--ink-soft);
      margin-left: 4px;
    }
    .res-line {
      margin: 8px 0 0;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.55;
      color: var(--ink);
    }
    .res-best {
      margin: 8px 0 20px;
      font-size: 16px;
      font-weight: 700;
      color: #a86400;
    }

    /* ── 토스트 ────────────────────────────────── */
    #toast {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 24px);
      padding: 9px 20px;
      background: rgba(13, 59, 69, 0.9);
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s;
      z-index: 15;
    }
    #toast.show { opacity: 1; }

    /* 화면 높이가 낮은 휴대폰(주소창이 보이는 크롬 등)에서도 시작 버튼까지 한 화면에 */
    @media (max-height: 780px) {
      .card { padding: 14px 14px calc(12px + env(safe-area-inset-bottom)); }
      .title { font-size: 23px; margin-bottom: 5px; }
      .lead { font-size: 15.5px; line-height: 1.5; margin-bottom: 10px; }
      .field { margin-bottom: 8px; }
      .field-label { font-size: 13.5px; margin-bottom: 5px; }
      .opt { min-height: 46px; padding: 7px 12px; }
      .opt-name { font-size: 18px; }
      .opt-desc { font-size: 13px; }
      .chip { min-height: 46px; font-size: 16px; }
      .start-btn { min-height: 54px; font-size: 21px; margin-top: 4px; }
      .hint { font-size: 14px; margin-top: 7px; }
      .res-score { font-size: 54px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="stat">
      <span class="k">점수</span>
      <span class="v" id="score">0</span>
    </div>
    <div class="stat" id="time-pill">
      <span class="k">남은 시간</span>
      <span class="v"><span id="time">60</span><em>초</em></span>
    </div>
    <button class="icon-btn" id="sound-btn" aria-label="소리 끄기">🔊</button>
    <button class="icon-btn" id="home-btn" aria-label="처음으로">🏠</button>
  </header>

  <div id="goalbar">
    <span class="gl" id="goal-label">목표 450점</span>
    <div class="track"><div id="goal-fill"></div></div>
    <span id="goal-now">0 / 450</span>
  </div>

  <div id="game-area">
    <canvas id="canvas"></canvas>
    <div id="toast">명중! 잘하셨어요!</div>

    <div id="overlay">
      <div class="card" id="card-menu">
        <h1 class="title">🎈 풍선 활쏘기</h1>
        <p class="lead">
          하늘의 풍선을 <b>콕! 누르면</b> 바로 발사!<br />
          <b>아래쪽을 밀었다 놓아도</b> 조준해서 쏠 수 있어요.
        </p>

        <div class="field">
          <p class="field-label">난이도</p>
          <div class="opt-list" id="diff-list">
            <button class="opt" data-diff="easy">
              <span class="opt-name">🌱 쉬움</span>
              <span class="opt-desc">풍선이 크고 느긋해요<br />목표 300점</span>
            </button>
            <button class="opt" data-diff="normal">
              <span class="opt-name">⭐ 보통</span>
              <span class="opt-desc">별 풍선 보너스<br />목표 450점</span>
            </button>
            <button class="opt" data-diff="hard">
              <span class="opt-name">🔥 도전</span>
              <span class="opt-desc">방해 풍선까지<br />목표 700점</span>
            </button>
          </div>
        </div>

        <div class="field">
          <p class="field-label">풍선 빠르기</p>
          <div class="chip-row" id="spd-list">
            <button class="chip" data-spd="slow">🐢 느리게</button>
            <button class="chip" data-spd="normal">🚶 보통</button>
            <button class="chip" data-spd="fast">🐇 빠르게</button>
          </div>
        </div>

        <button class="start-btn" id="start-btn">게임 시작하기</button>
        <p class="hint" id="menu-hint">⭐ 별 풍선을 맞히면 +30점이에요.</p>
        <p class="hint" id="menu-best">아직 기록이 없어요. 첫 기록을 세워 보세요!</p>
      </div>

      <div class="card hidden" id="card-result">
        <h2 class="title" id="res-title">수고하셨습니다!</h2>
        <div class="res-score"><span id="res-score-value">0</span><small>점</small></div>
        <p class="res-line" id="res-line"></p>
        <p class="res-best" id="res-best"></p>
        <button class="start-btn" id="again-btn">한 판 더</button>
        <button class="ghost-btn" id="back-btn">난이도 바꾸기</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var areaEl = document.getElementById('game-area');
      var overlay = document.getElementById('overlay');
      var cardMenu = document.getElementById('card-menu');
      var cardResult = document.getElementById('card-result');
      var scoreEl = document.getElementById('score');
      var timeEl = document.getElementById('time');
      var timePill = document.getElementById('time-pill');
      var goalLabelEl = document.getElementById('goal-label');
      var goalNowEl = document.getElementById('goal-now');
      var goalFill = document.getElementById('goal-fill');
      var toastEl = document.getElementById('toast');
      var soundBtn = document.getElementById('sound-btn');
      var diffList = document.getElementById('diff-list');
      var spdList = document.getElementById('spd-list');
      var menuHint = document.getElementById('menu-hint');
      var menuBest = document.getElementById('menu-best');

      var GAME_TIME = 60;

      var DIFF = {
        easy: {
          name: '쉬움', spawn: 1.3, size: 1.18, goal: 300, max: 4, bonus: 0, hazard: 0,
          hint: '풍선만 터뜨리면 돼요. 천천히 즐기세요!'
        },
        normal: {
          name: '보통', spawn: 1.0, size: 1.0, goal: 450, max: 5, bonus: 0.24, hazard: 0,
          hint: '⭐ 별 풍선을 맞히면 +30점이에요.'
        },
        hard: {
          name: '도전', spawn: 0.8, size: 0.86, goal: 700, max: 6, bonus: 0.2, hazard: 0.22,
          hint: '⭐ 별 +30점 · ⚫ 검은 풍선은 −15점이에요.'
        }
      };

      var SPD = {
        slow: { name: '느리게', mult: 0.8 },
        normal: { name: '보통', mult: 1.15 },
        fast: { name: '빠르게', mult: 1.5 }
      };

      var COLORS = [
        { fill: '#ff4d6d', shine: '#ff8fa3' },
        { fill: '#ffb703', shine: '#ffd166' },
        { fill: '#219ebc', shine: '#8ecae6' },
        { fill: '#2a9d8f', shine: '#76c893' },
        { fill: '#9b5de5', shine: '#c77dff' },
        { fill: '#fb5607', shine: '#ff9e6d' }
      ];

      var GOLD = { fill: '#ffc300', shine: '#fff3b0' };
      var DARK = { fill: '#2f3640', shine: '#7a8593' };

      var CHEERS = ['명중! 👏', '잘하셨어요! 👍', '정확해요! 🎯', '멋져요! ✨', '대단해요! 🌟'];

      var W = 0, H = 0;
      var mode = 'menu';
      var score = 0;
      var timeShown = GAME_TIME;
      var timeAcc = 0;
      var diff = readPref('diff', 'normal');
      var spd = readPref('spd', 'normal');
      var soundOn = readPref('sound', 'on') === 'on';
      if (!DIFF[diff]) diff = 'normal';
      if (!SPD[spd]) spd = 'normal';

      var balloons = [];
      var arrows = [];
      var particles = [];
      var rings = [];
      var floats = [];
      var bowAngle = -Math.PI / 2;
      var pull = 0;          // 활시위 당김 정도(0: 제자리, 1: 가득 당김)
      var pullVel = 0;
      var spawnAcc = 0;
      var lastT = 0;
      var goalDone = false;
      var toastTimer = null;
      var audioCtx = null;

      /* ── 저장 / 불러오기 ─────────────────────── */
      function readPref(key, dflt) {
        try {
          var v = window.localStorage.getItem('balloon2.' + key);
          return v === null ? dflt : v;
        } catch (e) { return dflt; }
      }
      function writePref(key, val) {
        try { window.localStorage.setItem('balloon2.' + key, val); } catch (e) {}
      }
      function getBest() {
        var n = parseInt(readPref('best.' + diff, '0'), 10);
        return isNaN(n) ? 0 : n;
      }

      /* ── 소리 ────────────────────────────────── */
      function tone(type, freq, endFreq, dur, vol) {
        if (!soundOn) return;
        try {
          if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            audioCtx = new AC();
          }
          var t0 = audioCtx.currentTime;
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t0);
          if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
          gain.gain.setValueAtTime(vol, t0);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t0);
          osc.stop(t0 + dur + 0.03);
        } catch (e) {}
      }
      // 짧고 맑은 파편 소리(밴드패스 노이즈)
      function noisePop(dur, vol, freq, q) {
        if (!soundOn) return;
        try {
          if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            audioCtx = new AC();
          }
          var t0 = audioCtx.currentTime;
          var len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
          var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
          var d = buf.getChannelData(0);
          for (var i = 0; i < len; i++) {
            var k = 1 - i / len;
            d[i] = (Math.random() * 2 - 1) * k * k;
          }
          var src = audioCtx.createBufferSource();
          src.buffer = buf;
          var bp = audioCtx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.value = freq;
          bp.Q.value = q;
          var g = audioCtx.createGain();
          g.gain.setValueAtTime(vol, t0);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          src.connect(bp);
          bp.connect(g);
          g.connect(audioCtx.destination);
          src.start(t0);
        } catch (e) {}
      }
      function popSound() {
        noisePop(0.075, 0.30, 1800 + Math.random() * 500, 1.1);   // 맑게 터지는 '팡'
        tone('sine', 1150 + Math.random() * 220, 420, 0.13, 0.19); // 동그란 울림
        window.setTimeout(function () { tone('sine', 2300, 2650, 0.06, 0.06); }, 12);
      }
      function shootSound() { tone('triangle', 300, 620, 0.09, 0.13); }
      function bonusSound() {
        tone('sine', 880, 990, 0.12, 0.16);
        window.setTimeout(function () { tone('sine', 1320, 1320, 0.16, 0.14); }, 90);
      }
      function buzzSound() { tone('sawtooth', 190, 90, 0.24, 0.14); }

      function updateSoundBtn() {
        soundBtn.textContent = soundOn ? '🔊' : '🔇';
        soundBtn.setAttribute('aria-label', soundOn ? '소리 끄기' : '소리 켜기');
      }
      soundBtn.addEventListener('click', function () {
        soundOn = !soundOn;
        writePref('sound', soundOn ? 'on' : 'off');
        updateSoundBtn();
        if (soundOn) tone('sine', 880, 880, 0.1, 0.12);
      });
      document.getElementById('home-btn').addEventListener('click', function () { showMenu(); });

      /* ── 화면 크기 ───────────────────────────── */
      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = areaEl.clientWidth;
        H = areaEl.clientHeight;
        canvas.width = Math.max(1, Math.round(W * dpr));
        canvas.height = Math.max(1, Math.round(H * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', function () {
        window.setTimeout(resize, 220);
      });

      /* ── 활 크기·위치 (풍선과 어울리는 1.15배) ── */
      var BOW_S = 1.15;        // 활·화살 확대 배율
      var BOW_BOTTOM = 34;     // 활(시위 아래 끝)이 중심에서 아래로 뻗는 길이(로컬 좌표)
      var BOW_TIP = 56;        // 중심에서 화살촉 끝까지(로컬 좌표)
      var HIT_SLOP = 20;       // 맞힘 판정 여유 반경

      function groundH() { return Math.max(26, H * 0.045); }
      function bowPos() {
        // 활 아래 끝이 잔디에 닿도록 중심을 잡는다(잘리지 않게)
        return { x: W / 2, y: H - groundH() - BOW_BOTTOM * BOW_S + 4 };
      }
      function muzzlePoint() {
        var bp = bowPos();
        return {
          x: bp.x + Math.cos(bowAngle) * BOW_TIP * BOW_S,
          y: bp.y + Math.sin(bowAngle) * BOW_TIP * BOW_S
        };
      }

      /* ── 풍선 ────────────────────────────────── */
      function spawnBalloon(demo) {
        var cfg = DIFF[diff];
        var baseR = Math.min(52, Math.max(30, W * 0.085));
        var r = baseR * (demo ? 1 : cfg.size);
        if (r < 26) r = 26;

        var kind = 'normal';
        var roll = Math.random();
        if (demo) {
          if (roll < 0.18) kind = 'bonus';
        } else {
          var hazards = 0;
          for (var i = 0; i < balloons.length; i++) {
            if (balloons[i].kind === 'hazard') hazards++;
          }
          var hazardsAllowed = (GAME_TIME - timeShown) >= 3 && hazards < 2;
          if (hazardsAllowed && roll < cfg.hazard) kind = 'hazard';
          else if (roll < cfg.hazard + cfg.bonus) kind = 'bonus';
        }

        var color = COLORS[Math.floor(Math.random() * COLORS.length)];
        if (kind === 'bonus') color = GOLD;
        if (kind === 'hazard') color = DARK;

        var mult = demo ? 0.5 : SPD[spd].mult;
        var vy = 82 * mult * (0.85 + Math.random() * 0.35);
        var margin = r + 12;

        // 활 바로 위에서 솟아 활을 가리지 않도록 좌우로 비켜서 올라온다
        var bx = margin + Math.random() * Math.max(1, W - margin * 2);
        var clear = 74;
        if (Math.abs(bx - W / 2) < clear) {
          bx = W / 2 + (bx < W / 2 ? -clear : clear);
          bx = Math.max(margin, Math.min(W - margin, bx));
        }

        balloons.push({
          x: bx,
          y: H - groundH() - r * 1.15,
          r: r,
          vy: vy,
          sway: Math.random() * Math.PI * 2,
          color: color,
          kind: kind
        });
      }

      function updateBalloons(dt) {
        for (var i = balloons.length - 1; i >= 0; i--) {
          var b = balloons[i];
          b.y -= b.vy * dt;
          b.x += Math.sin(b.y * 0.02 + b.sway) * 26 * dt;
          if (b.x < b.r + 6) b.x = b.r + 6;
          if (b.x > W - b.r - 6) b.x = W - b.r - 6;
          if (b.y < -b.r * 2.2) balloons.splice(i, 1);
        }
      }

      /* ── 조준·발사 ────────────────────────────── */
      var aim = { active: false, pointerId: null, angle: -Math.PI / 2 };

      function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

      // 하단 조준 영역 높이(손가락 지문에 활이 가리지 않도록 넓게)
      function aimZoneH() { return Math.max(96, Math.min(160, H * 0.23)); }

      function fireAt(angle) {
        if (mode !== 'play') return;
        var ang = clamp(angle, -Math.PI + 0.10, -0.10);
        bowAngle = ang;
        var m = muzzlePoint();
        // 콕 눌러 쏠 때도 시위가 팅! 하고 튕기는 손맛
        if (!aim.active) { pull = 0.55; pullVel = -5; }
        var speed = 980;
        arrows.push({
          x: m.x,
          y: m.y,
          vx: Math.cos(ang) * speed,
          vy: Math.sin(ang) * speed,
          angle: ang
        });
        shootSound();
      }

      // 하늘을 콕 누르면 그 지점으로 바로 발사
      function shootTo(tx, ty) {
        if (mode !== 'play') return;
        var bp = bowPos();
        var dx = tx - bp.x;
        var dy = ty - bp.y;
        if (dy > -30) return;
        fireAt(Math.atan2(dy, dx));
      }

      // 손가락 위치 → 조준 각도(손가락 위쪽에 가상의 조준점을 두어 방향을 정한다)
      function setAim(fx, fy) {
        var bp = bowPos();
        var zH = aimZoneH();
        var u = clamp((H - fy) / zH, 0, 1);    // 0: 영역 아래, 1: 영역 위
        var liftMin = BOW_TIP * BOW_S + 26;    // 활 끝 바로 위
        var liftMax = Math.max(liftMin + 140, bp.y - 70);
        var chY = bp.y - (liftMin + (liftMax - liftMin) * u);
        var chX = clamp(fx, 14, W - 14);
        aim.angle = clamp(Math.atan2(chY - bp.y, chX - bp.x), -Math.PI + 0.10, -0.10);
        bowAngle = aim.angle;
      }

      function localPoint(e) {
        var rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      canvas.addEventListener('pointerdown', function (e) {
        if (mode !== 'play') return;
        if (aim.active) return;   // 조준 중에는 다른 손가락을 무시
        e.preventDefault();
        var p = localPoint(e);
        if (p.y >= H - aimZoneH()) {
          // 아래쪽 넓은 영역: 대고 미는 동안 조준, 떼면 발사
          aim.active = true;
          aim.pointerId = e.pointerId;
          setAim(p.x, p.y);
          try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        } else {
          // 하늘·풍선: 짧게 콕 누르면 그 지점으로 즉시 발사
          shootTo(p.x, p.y);
        }
      });

      canvas.addEventListener('pointermove', function (e) {
        if (!aim.active || e.pointerId !== aim.pointerId) return;
        e.preventDefault();
        var p = localPoint(e);
        setAim(p.x, p.y);
      });

      canvas.addEventListener('pointerup', function (e) {
        if (!aim.active || e.pointerId !== aim.pointerId) return;
        e.preventDefault();
        aim.active = false;
        aim.pointerId = null;
        fireAt(aim.angle);
      });

      canvas.addEventListener('pointercancel', function (e) {
        if (!aim.active || e.pointerId !== aim.pointerId) return;
        aim.active = false;
        aim.pointerId = null;
      });

      // 화살촉이 지나간 선분과 풍선 중심 사이의 거리
      function segDist(x1, y1, x2, y2, cx, cy) {
        var dx = x2 - x1;
        var dy = y2 - y1;
        var len2 = dx * dx + dy * dy;
        var t = len2 > 0 ? ((cx - x1) * dx + (cy - y1) * dy) / len2 : 0;
        t = clamp(t, 0, 1);
        var ex = x1 + dx * t - cx;
        var ey = y1 + dy * t - cy;
        return Math.sqrt(ex * ex + ey * ey);
      }

      function updateArrows(dt) {
        var tipLen = 30 * BOW_S;
        for (var i = arrows.length - 1; i >= 0; i--) {
          var a = arrows[i];
          var px = a.x, py = a.y;
          a.x += a.vx * dt;
          a.y += a.vy * dt;

          // 화살촉이 이번 프레임에 지나간 자리까지 함께 보고,
          // 판정 반경을 넉넉히 주어 가장자리에 스쳐도 시원하게 터진다
          var tdx = Math.cos(a.angle) * tipLen;
          var tdy = Math.sin(a.angle) * tipLen;
          var x1 = px + tdx, y1 = py + tdy;
          var x2 = a.x + tdx, y2 = a.y + tdy;

          var hit = false;
          for (var j = balloons.length - 1; j >= 0; j--) {
            var b = balloons[j];
            if (segDist(x1, y1, x2, y2, b.x, b.y) <= b.r + HIT_SLOP) {
              balloons.splice(j, 1);
              resolveHit(b);
              hit = true;
              break;
            }
          }
          if (hit || a.x < -60 || a.x > W + 60 || a.y < -60 || a.y > H + 60) {
            arrows.splice(i, 1);
          }
        }
      }

      function resolveHit(b) {
        var burstColor = b.kind === 'bonus' ? GOLD.fill : (b.kind === 'hazard' ? '#55606e' : b.color.fill);
        var lightColor = b.kind === 'bonus' ? GOLD.shine : (b.kind === 'hazard' ? '#9aa5b1' : b.color.shine);
        createBurst(b.x, b.y, burstColor, lightColor);

        if (b.kind === 'bonus') {
          score += 30;
          addFloat(b.x, b.y, '+30', '#a86400');
          bonusSound();
          showToast('⭐ 별 풍선! +30점', 1000);
        } else if (b.kind === 'hazard') {
          score = Math.max(0, score - 15);
          addFloat(b.x, b.y, '−15', '#b3261e');
          buzzSound();
          showToast('검은 풍선 −15점', 1000);
        } else {
          score += 10;
          addFloat(b.x, b.y, '+10', '#0f8a80');
          popSound();
          showToast(CHEERS[Math.floor(Math.random() * CHEERS.length)], 800);
        }

        scoreEl.textContent = score;
        updateGoal();

        if (!goalDone && score >= DIFF[diff].goal) {
          goalDone = true;
          confetti();
          showToast('🎉 목표 달성!', 1600);
        }
      }

      /* ── 효과 ────────────────────────────────── */
      // 풍선 색 파편이 톡! 튀고 맑은 동심원 파동이 퍼진다
      function createBurst(x, y, color, light) {
        var n = 8;
        for (var i = 0; i < n; i++) {
          var ang = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.55;
          var spd = 150 + Math.random() * 240;
          particles.push({
            x: x, y: y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 34,
            r: 3.2 + Math.random() * 3.4,
            rot: Math.random() * Math.PI,
            spin: (Math.random() - 0.5) * 13,
            life: 1,
            color: i % 3 === 0 ? light : color,
            shard: true
          });
        }
        rings.push({ x: x, y: y, r: 8, w: 3.4, grow: 330, life: 1, color: color });
        rings.push({ x: x, y: y, r: 2, w: 2.0, grow: 220, life: 1, color: 'rgba(255, 255, 255, 0.95)' });
      }

      function confetti() {
        var cols = ['#ff4d6d', '#ffb703', '#219ebc', '#2a9d8f', '#9b5de5', '#ffc300'];
        for (var i = 0; i < 44; i++) {
          particles.push({
            x: Math.random() * W,
            y: H * (0.05 + Math.random() * 0.5),
            vx: (Math.random() - 0.5) * 160,
            vy: 40 + Math.random() * 200,
            r: 4 + Math.random() * 5,
            life: 1,
            color: cols[i % cols.length]
          });
        }
      }

      function addFloat(x, y, text, color) {
        floats.push({ x: x, y: y, text: text, color: color, life: 1 });
      }

      function updateEffects(dt) {
        var i;
        for (i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.98;
          p.vy = p.vy * 0.98 + 150 * dt;
          if (p.shard) p.rot += p.spin * dt;
          p.life -= dt * 1.6;
          if (p.life <= 0) particles.splice(i, 1);
        }
        for (i = rings.length - 1; i >= 0; i--) {
          var g = rings[i];
          g.r += g.grow * dt;
          g.life -= dt * 1.9;
          if (g.life <= 0) rings.splice(i, 1);
        }
        for (i = floats.length - 1; i >= 0; i--) {
          var f = floats[i];
          f.y -= 46 * dt;
          f.life -= dt * 1.1;
          if (f.life <= 0) floats.splice(i, 1);
        }
      }

      // 활시위 당김/팅! 복원(스프링)
      function updateBow(dt) {
        var target = (aim.active && mode === 'play') ? 1 : 0;
        var k = target > 0 ? 150 : 620;
        var damp = target > 0 ? 19 : 27;
        pullVel += (target - pull) * k * dt - pullVel * damp * dt;
        pull += pullVel * dt;
        if (pull < -0.32) { pull = -0.32; pullVel = 0; }
        if (pull > 1.12) { pull = 1.12; pullVel = 0; }
      }

      /* ── 그리기 ──────────────────────────────── */
      function drawStar(cx, cy, outer, inner, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        for (var i = 0; i < 10; i++) {
          var rad = (i % 2 === 0) ? outer : inner;
          var ang = (Math.PI / 5) * i - Math.PI / 2;
          var x = cx + Math.cos(ang) * rad;
          var y = cy + Math.sin(ang) * rad;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
      }

      function drawBalloon(b) {
        var r = b.r;

        ctx.strokeStyle = 'rgba(90, 110, 120, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + r * 1.15);
        ctx.quadraticCurveTo(b.x + 10, b.y + r * 1.6, b.x - 4, b.y + r * 2.1);
        ctx.stroke();

        ctx.save();
        if (b.kind === 'bonus') {
          ctx.shadowColor = 'rgba(255, 191, 0, 0.55)';
          ctx.shadowBlur = 16;
        }
        ctx.fillStyle = b.color.fill;
        ctx.beginPath();
        ctx.ellipse(b.x, b.y, r, r * 1.15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = b.color.shine;
        ctx.beginPath();
        ctx.ellipse(b.x - r * 0.32, b.y - r * 0.35, r * 0.22, r * 0.34, -0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = b.color.fill;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + r * 1.12);
        ctx.lineTo(b.x - 6, b.y + r * 1.26);
        ctx.lineTo(b.x + 6, b.y + r * 1.26);
        ctx.closePath();
        ctx.fill();

        if (b.kind === 'bonus') {
          drawStar(b.x, b.y + 1, r * 0.6, r * 0.26, '#8a5a00');
        } else if (b.kind === 'hazard') {
          ctx.fillStyle = '#ffffff';
          ctx.font = '800 ' + Math.round(r * 1.05) + 'px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('!', b.x, b.y + 2);
          ctx.textAlign = 'start';
          ctx.textBaseline = 'alphabetic';
        }
      }

      function drawArrow(a) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle + Math.PI / 2);
        ctx.scale(BOW_S, BOW_S);
        ctx.strokeStyle = '#3d2c2e';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 22);
        ctx.lineTo(0, -18);
        ctx.stroke();
        // 깃
        ctx.strokeStyle = '#e63946';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(0, 12);
        ctx.lineTo(-7, 24);
        ctx.moveTo(0, 12);
        ctx.lineTo(7, 24);
        ctx.stroke();
        // 촉
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.lineTo(-7, -15);
        ctx.lineTo(7, -15);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawBow() {
        var bp = bowPos();
        var p = Math.max(-0.32, Math.min(1, pull));

        // 활 그림자(잔디 위에 또렷하게)
        ctx.save();
        ctx.translate(bp.x, bp.y);
        ctx.fillStyle = 'rgba(13, 59, 69, 0.13)';
        ctx.beginPath();
        ctx.ellipse(0, BOW_BOTTOM * BOW_S - 1, 34 * BOW_S, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(bp.x, bp.y);
        ctx.rotate(bowAngle + Math.PI / 2);
        ctx.scale(BOW_S, BOW_S);

        // 활대: 당길수록 살짝 더 휘고, 놓으면 팅! 하고 제자리로
        var bend = p * 6;
        var rad = 46 + bend;
        var cy = 12 + bend * 0.35;
        ctx.strokeStyle = '#7f4f24';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, cy, rad, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();

        // 시위가 걸리는 활대 양끝
        var tipL = Math.cos(Math.PI * 1.15) * rad;
        var tipR = Math.cos(Math.PI * 1.85) * rad;
        var tipY = cy + Math.sin(Math.PI * 1.15) * rad;
        var nockY = 6 + p * 26;      // 시위 중앙(당김점)

        ctx.strokeStyle = '#4a5057';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(tipL, tipY);
        ctx.lineTo(0, nockY);
        ctx.lineTo(tipR, tipY);
        ctx.stroke();

        // 화살: 시위와 함께 뒤로 당겨진다
        var tipEnd = -44 + p * 26;
        ctx.strokeStyle = '#3d2c2e';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, nockY);
        ctx.lineTo(0, tipEnd);
        ctx.stroke();

        // 깃
        ctx.strokeStyle = '#e63946';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(0, nockY - 10);
        ctx.lineTo(-7, nockY + 4);
        ctx.moveTo(0, nockY - 10);
        ctx.lineTo(7, nockY + 4);
        ctx.stroke();

        // 촉
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.moveTo(0, tipEnd - 12);
        ctx.lineTo(-7, tipEnd + 3);
        ctx.lineTo(7, tipEnd + 3);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function drawParticle(p) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        ctx.fillStyle = p.color;
        if (p.shard) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.beginPath();
          ctx.moveTo(0, -p.r * 1.15);
          ctx.lineTo(p.r, p.r * 0.85);
          ctx.lineTo(-p.r, p.r * 0.85);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawRing(g) {
        ctx.globalAlpha = Math.max(0, Math.min(1, g.life)) * 0.8;
        ctx.strokeStyle = g.color;
        ctx.lineWidth = g.w;
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      function drawFloat(f) {
        ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
        ctx.fillStyle = f.color;
        ctx.font = '800 22px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(f.text, f.x, f.y);
        ctx.globalAlpha = 1;
        ctx.textAlign = 'start';
      }

      function roundRectPath(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      // 하단 넓은 조준 영역 표시
      function drawAimPad() {
        if (mode !== 'play') return;
        var zH = aimZoneH();
        var top = H - zH;
        var on = aim.active;
        ctx.save();
        ctx.fillStyle = on ? 'rgba(255, 255, 255, 0.26)' : 'rgba(255, 255, 255, 0.10)';
        roundRectPath(9, top + 3, W - 18, zH - 10, 18);
        ctx.fill();
        ctx.setLineDash([]);

        ctx.lineWidth = on ? 2.4 : 1.8;
        ctx.strokeStyle = on ? 'rgba(15, 138, 128, 0.55)' : 'rgba(13, 59, 69, 0.14)';
        ctx.beginPath();
        roundRectPath(9, top + 3, W - 18, zH - 10, 18);
        ctx.stroke();

        // 좌우로 밀어 조준하는 느낌을 주는 화살꼬리
        ctx.fillStyle = on ? 'rgba(15, 138, 128, 0.62)' : 'rgba(13, 59, 69, 0.26)';
        ctx.font = '800 24px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        var my = top + zH * 0.5;
        ctx.fillText('\u2039', 28, my);
        ctx.fillText('\u203a', W - 28, my);
        ctx.restore();
        ctx.textAlign = 'start';
        ctx.textBaseline = 'alphabetic';
      }

      // 미는 동안 활 바로 앞쪽에만 은은하게 또렷해지는 작은 점 5개
      function drawAimDots() {
        if (!aim.active || mode !== 'play') return;
        var m = muzzlePoint();
        var dx = Math.cos(aim.angle);
        var dy = Math.sin(aim.angle);
        ctx.save();
        for (var i = 0; i < 5; i++) {
          var t = 22 + i * 24;              // 활 앞 22~118px까지만
          var r = 5.2 - i * 0.85;           // 점점 작아지고
          var a = 0.42 - i * 0.07;          // 점점 흐려진다
          ctx.beginPath();
          ctx.arc(m.x + dx * t, m.y + dy * t, Math.max(1.4, r), 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(11, 84, 86, ' + a.toFixed(3) + ')';
          ctx.fill();
        }
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        var gH = groundH();
        ctx.fillStyle = '#8ccc68';
        ctx.fillRect(0, H - gH, W, gH);
        ctx.fillStyle = '#a9de84';
        ctx.fillRect(0, H - gH, W, 5);

        var i;
        drawAimPad();
        drawAimDots();
        for (i = 0; i < balloons.length; i++) drawBalloon(balloons[i]);
        for (i = 0; i < arrows.length; i++) drawArrow(arrows[i]);
        drawBow();
        for (i = 0; i < particles.length; i++) drawParticle(particles[i]);
        for (i = 0; i < rings.length; i++) drawRing(rings[i]);
        for (i = 0; i < floats.length; i++) drawFloat(floats[i]);
      }

      /* ── 진행 ────────────────────────────────── */
      function updateGoal() {
        var goal = DIFF[diff].goal;
        goalLabelEl.textContent = '목표 ' + goal + '점';
        goalNowEl.textContent = score + ' / ' + goal;
        var pct = Math.max(0, Math.min(100, Math.round((score / goal) * 100)));
        goalFill.style.width = pct + '%';
        if (score >= goal) goalFill.classList.add('done');
        else goalFill.classList.remove('done');
      }

      function showToast(msg, ms) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          toastEl.classList.remove('show');
        }, ms || 850);
      }

      function updatePlay(dt) {
        timeAcc += dt;
        if (timeAcc >= 1) {
          timeAcc -= 1;
          timeShown -= 1;
          timeEl.textContent = Math.max(0, timeShown);
          if (timeShown <= 10) timePill.classList.add('low');
          if (timeShown <= 0) { endGame(); return; }
        }

        spawnAcc += dt;
        var interval = DIFF[diff].spawn;
        if (spawnAcc >= interval) {
          spawnAcc = 0;
          if (balloons.length < DIFF[diff].max) spawnBalloon(false);
        }

        updateBalloons(dt);
        updateArrows(dt);
      }

      function updateDemo(dt) {
        spawnAcc += dt;
        if (spawnAcc >= 1.5) {
          spawnAcc = 0;
          if (balloons.length < 4) spawnBalloon(true);
        }
        updateBalloons(dt);
      }

      function tick(ts) {
        if (!lastT) lastT = ts;
        var dt = (ts - lastT) / 1000;
        lastT = ts;
        if (dt > 0.05) dt = 0.05;
        if (dt < 0) dt = 0;

        if (mode === 'play') {
          updatePlay(dt);
          updateEffects(dt);
        } else if (mode === 'menu') {
          updateDemo(dt);
          updateEffects(dt);
        }
        updateBow(dt);
        draw();
        window.requestAnimationFrame(tick);
      }

      /* ── 게임 시작 / 종료 ────────────────────── */
      function startGame() {
        if (audioCtx && audioCtx.state === 'suspended') {
          try { audioCtx.resume(); } catch (e) {}
        }
        score = 0;
        timeShown = GAME_TIME;
        timeAcc = 0;
        goalDone = false;
        balloons = [];
        arrows = [];
        particles = [];
        rings = [];
        floats = [];
        spawnAcc = 0;
        bowAngle = -Math.PI / 2;
        pull = 0;
        pullVel = 0;

        scoreEl.textContent = '0';
        timeEl.textContent = String(GAME_TIME);
        timePill.classList.remove('low');
        updateGoal();

        aim.active = false;
        aim.pointerId = null;

        cardMenu.classList.add('hidden');
        cardResult.classList.add('hidden');
        overlay.classList.add('hidden');
        mode = 'play';
        spawnBalloon(false);
        showToast('풍선을 콕! 또는 아래쪽을 밀어 쏘세요 🏹', 3000);
      }

      function endGame() {
        mode = 'over';
        aim.active = false;
        aim.pointerId = null;
        timeShown = 0;
        timeEl.textContent = '0';

        var goal = DIFF[diff].goal;
        var reached = score >= goal;
        var best = getBest();
        var isNew = score > best;
        if (isNew) writePref('best.' + diff, String(score));

        document.getElementById('res-score-value').textContent = score;
        document.getElementById('res-title').textContent = reached ? '🎉 목표 달성!' : '수고하셨습니다!';
        document.getElementById('res-line').textContent = reached
          ? '목표 ' + goal + '점을 넘었어요. 정말 잘하셨어요!'
          : '목표 ' + goal + '점까지 ' + (goal - score) + '점 남았어요.';
        document.getElementById('res-best').textContent = isNew
          ? '🏅 새 최고 기록 ' + score + '점'
          : '최고 기록 ' + Math.max(best, score) + '점';

        cardMenu.classList.add('hidden');
        cardResult.classList.remove('hidden');
        overlay.classList.remove('hidden');
      }

      function showMenu() {
        mode = 'menu';
        score = 0;
        timeShown = GAME_TIME;
        timeAcc = 0;
        goalDone = false;
        spawnAcc = 0;
        balloons = [];
        arrows = [];
        particles = [];
        rings = [];
        floats = [];
        bowAngle = -Math.PI / 2;
        pull = 0;
        pullVel = 0;

        scoreEl.textContent = '0';
        timeEl.textContent = String(GAME_TIME);
        timePill.classList.remove('low');
        updateGoal();

        aim.active = false;
        aim.pointerId = null;

        cardResult.classList.add('hidden');
        cardMenu.classList.remove('hidden');
        overlay.classList.remove('hidden');
        syncOptions();
      }

      function syncOptions() {
        var i;
        var opts = diffList.querySelectorAll('.opt');
        for (i = 0; i < opts.length; i++) {
          opts[i].classList.toggle('active', opts[i].getAttribute('data-diff') === diff);
        }
        var chips = spdList.querySelectorAll('.chip');
        for (i = 0; i < chips.length; i++) {
          chips[i].classList.toggle('active', chips[i].getAttribute('data-spd') === spd);
        }
        menuHint.textContent = DIFF[diff].hint;
        var best = getBest();
        menuBest.textContent = best > 0
          ? DIFF[diff].name + ' 난이도 최고 기록 ' + best + '점'
          : '아직 기록이 없어요. 첫 기록을 세워 보세요!';
      }

      /* ── 선택 버튼 ───────────────────────────── */
      diffList.addEventListener('click', function (e) {
        var target = e.target;
        while (target && target !== diffList && !target.getAttribute('data-diff')) {
          target = target.parentNode;
        }
        if (!target || target === diffList) return;
        diff = target.getAttribute('data-diff');
        if (!DIFF[diff]) diff = 'normal';
        writePref('diff', diff);
        syncOptions();
        updateGoal();
        tone('sine', 660, 780, 0.07, 0.08);
      });

      spdList.addEventListener('click', function (e) {
        var target = e.target;
        while (target && target !== spdList && !target.getAttribute('data-spd')) {
          target = target.parentNode;
        }
        if (!target || target === spdList) return;
        spd = target.getAttribute('data-spd');
        if (!SPD[spd]) spd = 'normal';
        writePref('spd', spd);
        syncOptions();
        tone('sine', 700, 820, 0.07, 0.08);
      });

      document.getElementById('start-btn').addEventListener('click', startGame);
      document.getElementById('again-btn').addEventListener('click', startGame);
      document.getElementById('back-btn').addEventListener('click', showMenu);

      /* ── 초기화 ──────────────────────────────── */
      updateSoundBtn();
      resize();
      showMenu();

      /* ── 검수 전용 훅(배포본에는 없음) ───────────── */
      window.__err = [];
      window.onerror = function (m) { window.__err.push(String(m)); };
      window.__g = function () {
        return {
          mode: mode, score: score, arrows: arrows.length, balloons: balloons.length,
          bow: +bowAngle.toFixed(3), pull: +pull.toFixed(3), aimActive: aim.active,
          particles: particles.length, rings: rings.length,
          W: W, H: H, zone: aimZoneH(), bowS: BOW_S, err: window.__err
        };
      };
      (function () {
        var q = window.location.search;
        if (/[?&]test=aim/.test(q)) {
          var fx = parseFloat((/[?&]fx=([\d.]+)/.exec(q) || [0, String(W * 0.34)])[1]);
          var fy = parseFloat((/[?&]fy=([\d.]+)/.exec(q) || [0, String(H - 22)])[1]);
          startGame();
          aim.active = true;
          setAim(fx, fy);
          ball('aim test');
        } else if (/[?&]test=pop/.test(q)) {
          startGame();
          window.setInterval(function () {
            var cols = ['#ff4d6d', '#ffb703', '#219ebc', '#2a9d8f'];
            var c = cols[Math.floor(Math.random() * cols.length)];
            createBurst(W * (0.32 + Math.random() * 0.36), H * (0.28 + Math.random() * 0.22), c, '#ffd166');
          }, 260);
        }
      })();
      function ball(t) { window.__tag = t; }
      window.requestAnimationFrame(tick);
    })();
  </script>
<script>
/* 홈 화면에 추가(설치형 앱)용 서비스 워커 등록 — 캐시 없음 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}
</script>
