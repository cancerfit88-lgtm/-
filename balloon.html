<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#e6f6ff" />
  <link rel="canonical" href="https://drena.co.kr/balloon.html" />

  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192-game.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="풍선 게임" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="🎈 시니어 활쏘기 풍선 터뜨리기" />
  <meta property="og:description" content="큰 글씨 · 터치 한 번으로 즐기는 활쏘기 집중력 게임" />
  <meta property="og:url" content="https://drena.co.kr/balloon.html" />
  <meta property="og:image" content="https://drena.co.kr/og-balloon.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta property="og:locale" content="ko_KR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="🎈 시니어 활쏘기 풍선 터뜨리기" />
  <meta name="twitter:description" content="큰 글씨 · 터치 한 번으로 즐기는 활쏘기 집중력 게임" />
  <meta name="twitter:image" content="https://drena.co.kr/og-balloon.jpg" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --ink: #0d3b45;
      --ink-soft: #3d5a63;
      --ink-mute: #5b7681;
      --teal: #0f8a80;
      --teal-dark: #0a6b63;
      --teal-soft: #e6f7f4;
      --line: #cfe7ee;
      --card: #ffffff;
      --coral: #d94f33;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
        'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
      background: linear-gradient(180deg, #ddf2ff 0%, #ecf9ff 42%, #fff8ea 100%);
      color: var(--ink);
      font-size: 17px;
      line-height: 1.6;
      letter-spacing: -0.01em;
      word-break: keep-all;
      overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── 상단 상태 바 ───────────────────────────── */
    header {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 8px;
      align-items: stretch;
      padding: calc(8px + env(safe-area-inset-top)) max(12px, calc((100% - 560px) / 2)) 8px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 2px solid var(--line);
      z-index: 10;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 5px 6px;
      border: 2px solid #bfe3ee;
      border-radius: 14px;
      background: #f4fbff;
    }
    .stat .k {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-mute);
      letter-spacing: 0;
      line-height: 1.2;
    }
    .stat .v {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.15;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .stat .v em {
      font-style: normal;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-mute);
      margin-left: 1px;
    }
    #time-pill.low {
      background: #fff1ee;
      border-color: #f3b8aa;
    }
    #time-pill.low .v { color: var(--coral); }
    .icon-btn {
      width: 48px;
      border: 2px solid #bfe3ee;
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font-size: 21px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .icon-btn:active { transform: translateY(1px); }

    /* ── 목표 진행 바 ───────────────────────────── */
    #goalbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px max(14px, calc((100% - 560px) / 2)) 8px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 2px solid var(--line);
      z-index: 9;
    }
    #goalbar .gl {
      font-size: 14px;
      font-weight: 800;
      color: var(--teal);
      white-space: nowrap;
      letter-spacing: 0;
    }
    #goalbar .track {
      flex: 1;
      min-width: 0;
      height: 12px;
      border-radius: 999px;
      background: #e3f1f5;
      overflow: hidden;
    }
    #goal-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #35c7ad, var(--teal));
      transition: width 0.25s ease;
    }
    #goal-fill.done { background: linear-gradient(90deg, #ffd166, #f0a100); }
    #goal-now {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-soft);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    /* ── 게임 화면 ─────────────────────────────── */
    #game-area {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 20;
    }
    #overlay.hidden { display: none; }
    .card {
      width: 100%;
      max-width: 430px;
      margin: auto;
      padding: 22px 18px calc(20px + env(safe-area-inset-bottom));
      background: var(--card);
      border: 1px solid #d8edf3;
      border-radius: 26px;
      box-shadow: 0 14px 40px rgba(13, 59, 69, 0.16);
      text-align: center;
    }
    .card.hidden { display: none; }
    .title {
      margin: 0 0 8px;
      font-size: clamp(26px, 7vw, 32px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-wrap: balance;
    }
    .lead {
      margin: 0 auto 18px;
      max-width: 330px;
      font-size: 18px;
      line-height: 1.72;
      color: var(--ink-soft);
    }
    .lead b { color: var(--teal); font-weight: 800; }

    .field { text-align: left; margin-bottom: 14px; }
    .field-label {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 800;
      color: var(--teal);
      letter-spacing: 0;
    }
    .opt-list { display: flex; flex-direction: column; gap: 8px; }
    .opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      padding: 10px 14px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: #f9fdff;
      color: var(--ink);
      font-family: inherit;
      cursor: pointer;
      text-align: left;
    }
    .opt-name {
      font-size: 19px;
      font-weight: 800;
      white-space: nowrap;
      letter-spacing: -0.01em;
    }
    .opt-desc {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--ink-mute);
      text-align: right;
    }
    .opt.active {
      border-color: var(--teal);
      background: var(--teal-soft);
    }
    .opt.active .opt-name { color: var(--teal-dark); }
    .opt.active .opt-name::after { content: ' ✓'; color: var(--teal); }
    .opt.active .opt-desc { color: var(--teal-dark); }

    .chip-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .chip {
      min-height: 54px;
      padding: 8px 4px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: #f9fdff;
      color: var(--ink);
      font-family: inherit;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.01em;
      white-space: nowrap;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .chip.active {
      border-color: var(--teal);
      background: var(--teal);
      color: #fff;
    }

    .start-btn {
      width: 100%;
      min-height: 62px;
      margin-top: 6px;
      border: none;
      border-radius: 20px;
      background: var(--teal);
      color: #fff;
      font-family: inherit;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--teal-dark);
      transition: transform 0.06s, box-shadow 0.06s;
    }
    .start-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--teal-dark);
    }
    .ghost-btn {
      width: 100%;
      min-height: 54px;
      margin-top: 10px;
      border: 2px solid var(--line);
      border-radius: 18px;
      background: #fff;
      color: var(--ink-soft);
      font-family: inherit;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }
    .hint {
      margin: 12px 0 0;
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink-mute);
    }

    /* ── 결과 화면 ─────────────────────────────── */
    .res-score {
      margin-top: 4px;
      font-size: clamp(56px, 16vw, 68px);
      font-weight: 800;
      line-height: 1.05;
      color: var(--teal);
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .res-score small {
      font-size: 24px;
      font-weight: 800;
      color: var(--ink-soft);
      margin-left: 4px;
    }
    .res-line {
      margin: 8px 0 0;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.55;
      color: var(--ink);
    }
    .res-best {
      margin: 8px 0 20px;
      font-size: 16px;
      font-weight: 700;
      color: #a86400;
    }

    /* ── 토스트 ────────────────────────────────── */
    #toast {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 24px);
      padding: 9px 20px;
      background: rgba(13, 59, 69, 0.9);
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s;
      z-index: 15;
    }
    #toast.show { opacity: 1; }

    @media (max-height: 720px) {
      .card { padding: 18px 16px 16px; }
      .title { font-size: 25px; }
      .lead { font-size: 17px; margin-bottom: 14px; }
      .opt { min-height: 48px; padding: 8px 12px; }
      .opt-name { font-size: 18px; }
      .chip { min-height: 48px; }
      .start-btn { min-height: 56px; font-size: 22px; }
      .field { margin-bottom: 11px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="stat">
      <span class="k">점수</span>
      <span class="v" id="score">0</span>
    </div>
    <div class="stat" id="time-pill">
      <span class="k">남은 시간</span>
      <span class="v"><span id="time">60</span><em>초</em></span>
    </div>
    <button class="icon-btn" id="sound-btn" aria-label="소리 끄기">🔊</button>
    <button class="icon-btn" id="home-btn" aria-label="처음으로">🏠</button>
  </header>

  <div id="goalbar">
    <span class="gl" id="goal-label">목표 450점</span>
    <div class="track"><div id="goal-fill"></div></div>
    <span id="goal-now">0 / 450</span>
  </div>

  <div id="game-area">
    <canvas id="canvas"></canvas>
    <div id="toast">명중! 잘하셨어요!</div>

    <div id="overlay">
      <div class="card" id="card-menu">
        <h1 class="title">🎈 풍선 활쏘기</h1>
        <p class="lead">
          하늘로 날아오르는 풍선을<br />
          <b>손가락으로 콕! 누르면</b> 화살이 날아가 터집니다.
        </p>

        <div class="field">
          <p class="field-label">난이도</p>
          <div class="opt-list" id="diff-list">
            <button class="opt" data-diff="easy">
              <span class="opt-name">🌱 쉬움</span>
              <span class="opt-desc">풍선이 크고 느긋해요<br />목표 300점</span>
            </button>
            <button class="opt" data-diff="normal">
              <span class="opt-name">⭐ 보통</span>
              <span class="opt-desc">별 풍선 보너스<br />목표 450점</span>
            </button>
            <button class="opt" data-diff="hard">
              <span class="opt-name">🔥 도전</span>
              <span class="opt-desc">방해 풍선까지<br />목표 700점</span>
            </button>
          </div>
        </div>

        <div class="field">
          <p class="field-label">풍선 빠르기</p>
          <div class="chip-row" id="spd-list">
            <button class="chip" data-spd="slow">🐢 느리게</button>
            <button class="chip" data-spd="normal">🚶 보통</button>
            <button class="chip" data-spd="fast">🐇 빠르게</button>
          </div>
        </div>

        <button class="start-btn" id="start-btn">게임 시작하기</button>
        <p class="hint" id="menu-hint">⭐ 별 풍선을 맞히면 +30점이에요.</p>
        <p class="hint" id="menu-best">아직 기록이 없어요. 첫 기록을 세워 보세요!</p>
      </div>

      <div class="card hidden" id="card-result">
        <h2 class="title" id="res-title">수고하셨습니다!</h2>
        <div class="res-score"><span id="res-score-value">0</span><small>점</small></div>
        <p class="res-line" id="res-line"></p>
        <p class="res-best" id="res-best"></p>
        <button class="start-btn" id="again-btn">한 판 더</button>
        <button class="ghost-btn" id="back-btn">난이도 바꾸기</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var areaEl = document.getElementById('game-area');
      var overlay = document.getElementById('overlay');
      var cardMenu = document.getElementById('card-menu');
      var cardResult = document.getElementById('card-result');
      var scoreEl = document.getElementById('score');
      var timeEl = document.getElementById('time');
      var timePill = document.getElementById('time-pill');
      var goalLabelEl = document.getElementById('goal-label');
      var goalNowEl = document.getElementById('goal-now');
      var goalFill = document.getElementById('goal-fill');
      var toastEl = document.getElementById('toast');
      var soundBtn = document.getElementById('sound-btn');
      var diffList = document.getElementById('diff-list');
      var spdList = document.getElementById('spd-list');
      var menuHint = document.getElementById('menu-hint');
      var menuBest = document.getElementById('menu-best');

      var GAME_TIME = 60;

      var DIFF = {
        easy: {
          name: '쉬움', spawn: 1.3, size: 1.18, goal: 300, max: 4, bonus: 0, hazard: 0,
          hint: '풍선만 터뜨리면 돼요. 천천히 즐기세요!'
        },
        normal: {
          name: '보통', spawn: 1.0, size: 1.0, goal: 450, max: 5, bonus: 0.24, hazard: 0,
          hint: '⭐ 별 풍선을 맞히면 +30점이에요.'
        },
        hard: {
          name: '도전', spawn: 0.8, size: 0.86, goal: 700, max: 6, bonus: 0.2, hazard: 0.22,
          hint: '⭐ 별 +30점 · ⚫ 검은 풍선은 −15점이에요.'
        }
      };

      var SPD = {
        slow: { name: '느리게', mult: 0.8 },
        normal: { name: '보통', mult: 1.15 },
        fast: { name: '빠르게', mult: 1.5 }
      };

      var COLORS = [
        { fill: '#ff4d6d', shine: '#ff8fa3' },
        { fill: '#ffb703', shine: '#ffd166' },
        { fill: '#219ebc', shine: '#8ecae6' },
        { fill: '#2a9d8f', shine: '#76c893' },
        { fill: '#9b5de5', shine: '#c77dff' },
        { fill: '#fb5607', shine: '#ff9e6d' }
      ];

      var GOLD = { fill: '#ffc300', shine: '#fff3b0' };
      var DARK = { fill: '#2f3640', shine: '#7a8593' };

      var CHEERS = ['명중! 👏', '잘하셨어요! 👍', '정확해요! 🎯', '멋져요! ✨', '대단해요! 🌟'];

      var W = 0, H = 0;
      var mode = 'menu';
      var score = 0;
      var timeShown = GAME_TIME;
      var timeAcc = 0;
      var diff = readPref('diff', 'normal');
      var spd = readPref('spd', 'normal');
      var soundOn = readPref('sound', 'on') === 'on';
      if (!DIFF[diff]) diff = 'normal';
      if (!SPD[spd]) spd = 'normal';

      var balloons = [];
      var arrows = [];
      var particles = [];
      var floats = [];
      var bowAngle = -Math.PI / 2;
      var spawnAcc = 0;
      var lastT = 0;
      var goalDone = false;
      var toastTimer = null;
      var audioCtx = null;

      /* ── 저장 / 불러오기 ─────────────────────── */
      function readPref(key, dflt) {
        try {
          var v = window.localStorage.getItem('balloon2.' + key);
          return v === null ? dflt : v;
        } catch (e) { return dflt; }
      }
      function writePref(key, val) {
        try { window.localStorage.setItem('balloon2.' + key, val); } catch (e) {}
      }
      function getBest() {
        var n = parseInt(readPref('best.' + diff, '0'), 10);
        return isNaN(n) ? 0 : n;
      }

      /* ── 소리 ────────────────────────────────── */
      function tone(type, freq, endFreq, dur, vol) {
        if (!soundOn) return;
        try {
          if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            audioCtx = new AC();
          }
          var t0 = audioCtx.currentTime;
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t0);
          if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
          gain.gain.setValueAtTime(vol, t0);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t0);
          osc.stop(t0 + dur + 0.03);
        } catch (e) {}
      }
      function popSound() { tone('sine', 480 + Math.random() * 180, 160, 0.15, 0.26); }
      function shootSound() { tone('triangle', 300, 620, 0.09, 0.13); }
      function bonusSound() {
        tone('sine', 880, 990, 0.12, 0.16);
        window.setTimeout(function () { tone('sine', 1320, 1320, 0.16, 0.14); }, 90);
      }
      function buzzSound() { tone('sawtooth', 190, 90, 0.24, 0.14); }

      function updateSoundBtn() {
        soundBtn.textContent = soundOn ? '🔊' : '🔇';
        soundBtn.setAttribute('aria-label', soundOn ? '소리 끄기' : '소리 켜기');
      }
      soundBtn.addEventListener('click', function () {
        soundOn = !soundOn;
        writePref('sound', soundOn ? 'on' : 'off');
        updateSoundBtn();
        if (soundOn) tone('sine', 880, 880, 0.1, 0.12);
      });
      document.getElementById('home-btn').addEventListener('click', function () { showMenu(); });

      /* ── 화면 크기 ───────────────────────────── */
      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = areaEl.clientWidth;
        H = areaEl.clientHeight;
        canvas.width = Math.max(1, Math.round(W * dpr));
        canvas.height = Math.max(1, Math.round(H * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', function () {
        window.setTimeout(resize, 220);
      });

      function groundH() { return Math.max(26, H * 0.045); }
      function bowPos() {
        var gH = groundH();
        return { x: W / 2, y: H - gH - 10 };
      }

      /* ── 풍선 ────────────────────────────────── */
      function spawnBalloon(demo) {
        var cfg = DIFF[diff];
        var baseR = Math.min(52, Math.max(30, W * 0.085));
        var r = baseR * (demo ? 1 : cfg.size);
        if (r < 26) r = 26;

        var kind = 'normal';
        var roll = Math.random();
        if (demo) {
          if (roll < 0.18) kind = 'bonus';
        } else {
          var hazards = 0;
          for (var i = 0; i < balloons.length; i++) {
            if (balloons[i].kind === 'hazard') hazards++;
          }
          var hazardsAllowed = (GAME_TIME - timeShown) >= 3 && hazards < 2;
          if (hazardsAllowed && roll < cfg.hazard) kind = 'hazard';
          else if (roll < cfg.hazard + cfg.bonus) kind = 'bonus';
        }

        var color = COLORS[Math.floor(Math.random() * COLORS.length)];
        if (kind === 'bonus') color = GOLD;
        if (kind === 'hazard') color = DARK;

        var mult = demo ? 0.5 : SPD[spd].mult;
        var vy = 82 * mult * (0.85 + Math.random() * 0.35);
        var bp = bowPos();
        var margin = r + 12;

        balloons.push({
          x: margin + Math.random() * Math.max(1, W - margin * 2),
          y: bp.y - 4,
          r: r,
          vy: vy,
          sway: Math.random() * Math.PI * 2,
          color: color,
          kind: kind
        });
      }

      function updateBalloons(dt) {
        for (var i = balloons.length - 1; i >= 0; i--) {
          var b = balloons[i];
          b.y -= b.vy * dt;
          b.x += Math.sin(b.y * 0.02 + b.sway) * 26 * dt;
          if (b.x < b.r + 6) b.x = b.r + 6;
          if (b.x > W - b.r - 6) b.x = W - b.r - 6;
          if (b.y < -b.r * 2.2) balloons.splice(i, 1);
        }
      }

      /* ── 화살 ────────────────────────────────── */
      function shootTo(tx, ty) {
        if (mode !== 'play') return;
        var bp = bowPos();
        var dx = tx - bp.x;
        var dy = ty - bp.y;
        if (dy > -20) return;
        var angle = Math.atan2(dy, dx);
        if (angle > -0.12 || angle < -Math.PI + 0.12) return;
        bowAngle = angle;
        var speed = 980;
        arrows.push({
          x: bp.x,
          y: bp.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          angle: angle
        });
        shootSound();
      }

      canvas.addEventListener('pointerdown', function (e) {
        if (mode !== 'play') return;
        e.preventDefault();
        var rect = canvas.getBoundingClientRect();
        shootTo(e.clientX - rect.left, e.clientY - rect.top);
      });

      function updateArrows(dt) {
        for (var i = arrows.length - 1; i >= 0; i--) {
          var a = arrows[i];
          a.x += a.vx * dt;
          a.y += a.vy * dt;

          var hit = false;
          for (var j = balloons.length - 1; j >= 0; j--) {
            var b = balloons[j];
            var dx = a.x - b.x;
            var dy = a.y - b.y;
            if (Math.sqrt(dx * dx + dy * dy) <= b.r + 14) {
              balloons.splice(j, 1);
              resolveHit(b);
              hit = true;
              break;
            }
          }
          if (hit || a.x < -60 || a.x > W + 60 || a.y < -60 || a.y > H + 60) {
            arrows.splice(i, 1);
          }
        }
      }

      function resolveHit(b) {
        var burstColor = b.kind === 'bonus' ? GOLD.fill : (b.kind === 'hazard' ? '#55606e' : b.color.fill);
        createBurst(b.x, b.y, burstColor);

        if (b.kind === 'bonus') {
          score += 30;
          addFloat(b.x, b.y, '+30', '#a86400');
          bonusSound();
          showToast('⭐ 별 풍선! +30점', 1000);
        } else if (b.kind === 'hazard') {
          score = Math.max(0, score - 15);
          addFloat(b.x, b.y, '−15', '#b3261e');
          buzzSound();
          showToast('검은 풍선 −15점', 1000);
        } else {
          score += 10;
          addFloat(b.x, b.y, '+10', '#0f8a80');
          popSound();
          showToast(CHEERS[Math.floor(Math.random() * CHEERS.length)], 800);
        }

        scoreEl.textContent = score;
        updateGoal();

        if (!goalDone && score >= DIFF[diff].goal) {
          goalDone = true;
          confetti();
          showToast('🎉 목표 달성!', 1600);
        }
      }

      /* ── 효과 ────────────────────────────────── */
      function createBurst(x, y, color) {
        for (var i = 0; i < 16; i++) {
          var ang = (Math.PI * 2 * i) / 16 + Math.random() * 0.25;
          var spd = 120 + Math.random() * 260;
          particles.push({
            x: x, y: y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            r: 4 + Math.random() * 5,
            life: 1,
            color: color
          });
        }
      }

      function confetti() {
        var cols = ['#ff4d6d', '#ffb703', '#219ebc', '#2a9d8f', '#9b5de5', '#ffc300'];
        for (var i = 0; i < 44; i++) {
          particles.push({
            x: Math.random() * W,
            y: H * (0.05 + Math.random() * 0.5),
            vx: (Math.random() - 0.5) * 160,
            vy: 40 + Math.random() * 200,
            r: 4 + Math.random() * 5,
            life: 1,
            color: cols[i % cols.length]
          });
        }
      }

      function addFloat(x, y, text, color) {
        floats.push({ x: x, y: y, text: text, color: color, life: 1 });
      }

      function updateEffects(dt) {
        var i;
        for (i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.98;
          p.vy = p.vy * 0.98 + 150 * dt;
          p.life -= dt * 1.6;
          if (p.life <= 0) particles.splice(i, 1);
        }
        for (i = floats.length - 1; i >= 0; i--) {
          var f = floats[i];
          f.y -= 46 * dt;
          f.life -= dt * 1.1;
          if (f.life <= 0) floats.splice(i, 1);
        }
      }

      /* ── 그리기 ──────────────────────────────── */
      function drawStar(cx, cy, outer, inner, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        for (var i = 0; i < 10; i++) {
          var rad = (i % 2 === 0) ? outer : inner;
          var ang = (Math.PI / 5) * i - Math.PI / 2;
          var x = cx + Math.cos(ang) * rad;
          var y = cy + Math.sin(ang) * rad;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
      }

      function drawBalloon(b) {
        var r = b.r;

        ctx.strokeStyle = 'rgba(90, 110, 120, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + r * 1.15);
        ctx.quadraticCurveTo(b.x + 10, b.y + r * 1.6, b.x - 4, b.y + r * 2.1);
        ctx.stroke();

        ctx.save();
        if (b.kind === 'bonus') {
          ctx.shadowColor = 'rgba(255, 191, 0, 0.55)';
          ctx.shadowBlur = 16;
        }
        ctx.fillStyle = b.color.fill;
        ctx.beginPath();
        ctx.ellipse(b.x, b.y, r, r * 1.15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = b.color.shine;
        ctx.beginPath();
        ctx.ellipse(b.x - r * 0.32, b.y - r * 0.35, r * 0.22, r * 0.34, -0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = b.color.fill;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + r * 1.12);
        ctx.lineTo(b.x - 6, b.y + r * 1.26);
        ctx.lineTo(b.x + 6, b.y + r * 1.26);
        ctx.closePath();
        ctx.fill();

        if (b.kind === 'bonus') {
          drawStar(b.x, b.y + 1, r * 0.6, r * 0.26, '#8a5a00');
        } else if (b.kind === 'hazard') {
          ctx.fillStyle = '#ffffff';
          ctx.font = '800 ' + Math.round(r * 1.05) + 'px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('!', b.x, b.y + 2);
          ctx.textAlign = 'start';
          ctx.textBaseline = 'alphabetic';
        }
      }

      function drawArrow(a) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle + Math.PI / 2);
        ctx.strokeStyle = '#3d2c2e';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 22);
        ctx.lineTo(0, -18);
        ctx.stroke();
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.lineTo(-7, -15);
        ctx.lineTo(7, -15);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawBow() {
        var bp = bowPos();
        ctx.save();
        ctx.translate(bp.x, bp.y);
        ctx.rotate(bowAngle + Math.PI / 2);

        ctx.strokeStyle = '#7f4f24';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, 12, 46, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();

        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-40, -10);
        ctx.lineTo(0, 6);
        ctx.lineTo(40, -10);
        ctx.stroke();

        ctx.strokeStyle = '#333';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 6);
        ctx.lineTo(0, -44);
        ctx.stroke();
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.moveTo(0, -56);
        ctx.lineTo(-7, -41);
        ctx.lineTo(7, -41);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function drawParticle(p) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      function drawFloat(f) {
        ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
        ctx.fillStyle = f.color;
        ctx.font = '800 22px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(f.text, f.x, f.y);
        ctx.globalAlpha = 1;
        ctx.textAlign = 'start';
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        var gH = groundH();
        ctx.fillStyle = '#8ccc68';
        ctx.fillRect(0, H - gH, W, gH);
        ctx.fillStyle = '#a9de84';
        ctx.fillRect(0, H - gH, W, 5);

        var i;
        for (i = 0; i < balloons.length; i++) drawBalloon(balloons[i]);
        for (i = 0; i < arrows.length; i++) drawArrow(arrows[i]);
        drawBow();
        for (i = 0; i < particles.length; i++) drawParticle(particles[i]);
        for (i = 0; i < floats.length; i++) drawFloat(floats[i]);
      }

      /* ── 진행 ────────────────────────────────── */
      function updateGoal() {
        var goal = DIFF[diff].goal;
        goalLabelEl.textContent = '목표 ' + goal + '점';
        goalNowEl.textContent = score + ' / ' + goal;
        var pct = Math.max(0, Math.min(100, Math.round((score / goal) * 100)));
        goalFill.style.width = pct + '%';
        if (score >= goal) goalFill.classList.add('done');
        else goalFill.classList.remove('done');
      }

      function showToast(msg, ms) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          toastEl.classList.remove('show');
        }, ms || 850);
      }

      function updatePlay(dt) {
        timeAcc += dt;
        if (timeAcc >= 1) {
          timeAcc -= 1;
          timeShown -= 1;
          timeEl.textContent = Math.max(0, timeShown);
          if (timeShown <= 10) timePill.classList.add('low');
          if (timeShown <= 0) { endGame(); return; }
        }

        spawnAcc += dt;
        var interval = DIFF[diff].spawn;
        if (spawnAcc >= interval) {
          spawnAcc = 0;
          if (balloons.length < DIFF[diff].max) spawnBalloon(false);
        }

        updateBalloons(dt);
        updateArrows(dt);
      }

      function updateDemo(dt) {
        spawnAcc += dt;
        if (spawnAcc >= 1.5) {
          spawnAcc = 0;
          if (balloons.length < 4) spawnBalloon(true);
        }
        updateBalloons(dt);
      }

      function tick(ts) {
        if (!lastT) lastT = ts;
        var dt = (ts - lastT) / 1000;
        lastT = ts;
        if (dt > 0.05) dt = 0.05;
        if (dt < 0) dt = 0;

        if (mode === 'play') {
          updatePlay(dt);
          updateEffects(dt);
        } else if (mode === 'menu') {
          updateDemo(dt);
          updateEffects(dt);
        }
        draw();
        window.requestAnimationFrame(tick);
      }

      /* ── 게임 시작 / 종료 ────────────────────── */
      function startGame() {
        if (audioCtx && audioCtx.state === 'suspended') {
          try { audioCtx.resume(); } catch (e) {}
        }
        score = 0;
        timeShown = GAME_TIME;
        timeAcc = 0;
        goalDone = false;
        balloons = [];
        arrows = [];
        particles = [];
        floats = [];
        spawnAcc = 0;
        bowAngle = -Math.PI / 2;

        scoreEl.textContent = '0';
        timeEl.textContent = String(GAME_TIME);
        timePill.classList.remove('low');
        updateGoal();

        cardMenu.classList.add('hidden');
        cardResult.classList.add('hidden');
        overlay.classList.add('hidden');
        mode = 'play';
        spawnBalloon(false);
        showToast('시작! 풍선을 향해 쏘세요 🏹', 1200);
      }

      function endGame() {
        mode = 'over';
        timeShown = 0;
        timeEl.textContent = '0';

        var goal = DIFF[diff].goal;
        var reached = score >= goal;
        var best = getBest();
        var isNew = score > best;
        if (isNew) writePref('best.' + diff, String(score));

        document.getElementById('res-score-value').textContent = score;
        document.getElementById('res-title').textContent = reached ? '🎉 목표 달성!' : '수고하셨습니다!';
        document.getElementById('res-line').textContent = reached
          ? '목표 ' + goal + '점을 넘었어요. 정말 잘하셨어요!'
          : '목표 ' + goal + '점까지 ' + (goal - score) + '점 남았어요.';
        document.getElementById('res-best').textContent = isNew
          ? '🏅 새 최고 기록 ' + score + '점'
          : '최고 기록 ' + Math.max(best, score) + '점';

        cardMenu.classList.add('hidden');
        cardResult.classList.remove('hidden');
        overlay.classList.remove('hidden');
      }

      function showMenu() {
        mode = 'menu';
        score = 0;
        timeShown = GAME_TIME;
        timeAcc = 0;
        goalDone = false;
        spawnAcc = 0;
        balloons = [];
        arrows = [];
        particles = [];
        floats = [];
        bowAngle = -Math.PI / 2;

        scoreEl.textContent = '0';
        timeEl.textContent = String(GAME_TIME);
        timePill.classList.remove('low');
        updateGoal();

        cardResult.classList.add('hidden');
        cardMenu.classList.remove('hidden');
        overlay.classList.remove('hidden');
        syncOptions();
      }

      function syncOptions() {
        var i;
        var opts = diffList.querySelectorAll('.opt');
        for (i = 0; i < opts.length; i++) {
          opts[i].classList.toggle('active', opts[i].getAttribute('data-diff') === diff);
        }
        var chips = spdList.querySelectorAll('.chip');
        for (i = 0; i < chips.length; i++) {
          chips[i].classList.toggle('active', chips[i].getAttribute('data-spd') === spd);
        }
        menuHint.textContent = DIFF[diff].hint;
        var best = getBest();
        menuBest.textContent = best > 0
          ? DIFF[diff].name + ' 난이도 최고 기록 ' + best + '점'
          : '아직 기록이 없어요. 첫 기록을 세워 보세요!';
      }

      /* ── 선택 버튼 ───────────────────────────── */
      diffList.addEventListener('click', function (e) {
        var target = e.target;
        while (target && target !== diffList && !target.getAttribute('data-diff')) {
          target = target.parentNode;
        }
        if (!target || target === diffList) return;
        diff = target.getAttribute('data-diff');
        if (!DIFF[diff]) diff = 'normal';
        writePref('diff', diff);
        syncOptions();
        updateGoal();
        tone('sine', 660, 780, 0.07, 0.08);
      });

      spdList.addEventListener('click', function (e) {
        var target = e.target;
        while (target && target !== spdList && !target.getAttribute('data-spd')) {
          target = target.parentNode;
        }
        if (!target || target === spdList) return;
        spd = target.getAttribute('data-spd');
        if (!SPD[spd]) spd = 'normal';
        writePref('spd', spd);
        syncOptions();
        tone('sine', 700, 820, 0.07, 0.08);
      });

      document.getElementById('start-btn').addEventListener('click', startGame);
      document.getElementById('again-btn').addEventListener('click', startGame);
      document.getElementById('back-btn').addEventListener('click', showMenu);

      /* ── 초기화 ──────────────────────────────── */
      updateSoundBtn();
      resize();
      showMenu();
      window.requestAnimationFrame(tick);
    })();
  </script>
<script>
/* 홈 화면에 추가(설치형 앱)용 서비스 워커 등록 — 캐시 없음 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}
</script>
</body>
