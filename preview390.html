<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>390 미리보기</title>
<style>
  html, body { margin: 0; padding: 0; background: #20303a; }
  #wrap { position: absolute; top: 0; left: 0; width: 390px; height: 844px; overflow: hidden; }
  #wrap iframe { width: 390px; height: 844px; border: 0; display: block; background: #fff; }
</style>
</head>
<body>
<div id="wrap"><iframe id="f" src="/game-v3test/"></iframe></div>
<script>
  var q = location.search;
  var hm = /[?&]h=(\d+)/.exec(q);
  if (hm) {
    document.getElementById('wrap').style.height = hm[1] + 'px';
    document.getElementById('f').style.height = hm[1] + 'px';
  }
  var pm = /[?&]p=([^&]+)/.exec(q);
  var src = pm ? decodeURIComponent(pm[1]) : '/game-v3test/';
  if (q) src += '?v=' + Date.now();
  document.getElementById('f').src = src;
</script>
</body>
</html>
